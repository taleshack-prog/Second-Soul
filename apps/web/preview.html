<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Second Soul — preview do wizard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --base:#0C1024; --surface:#151A33; --surface2:#1E2444; --line:#2A3157;
    --ink:#ECEDF6; --muted:#9AA0C4; --soul:#E8B060; --soulglow:rgba(232,176,96,.16);
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;background:var(--base);color:var(--ink);
    font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(60% 45% at 50% -5%,var(--soulglow),transparent 70%);
    background-repeat:no-repeat;
  }
  .display{font-family:Fraunces,serif}
  main{max-width:960px;margin:0 auto;padding:56px 24px;display:grid;gap:48px;grid-template-columns:220px 1fr}
  @media (max-width:760px){main{grid-template-columns:1fr;padding-top:40px}}
  .rail-brand{display:flex;align-items:center;gap:10px;margin-bottom:40px;font-size:18px}
  ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px}
  ol.steps li{display:flex;gap:12px;align-items:flex-start}
  .snum{font-family:Fraunces,serif;font-size:14px;color:var(--line)}
  .snum.active{color:var(--soul)} .snum.done{color:var(--muted)}
  .stitle{font-size:14px;color:var(--muted);line-height:1.2}
  .stitle.active{color:var(--ink)}
  section{max-width:576px}
  .eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--soul)}
  h1{font-family:Fraunces,serif;font-weight:500;line-height:1.1;margin:12px 0 0;font-size:40px}
  p.lead{font-size:17px;line-height:1.65;color:var(--muted);margin-top:20px}
  .card{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:24px;margin-top:32px}
  .card h2{font-family:Fraunces,serif;font-weight:500;font-size:18px;margin:0}
  ol.instr{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:12px;font-size:15px;color:var(--muted)}
  ol.instr li{display:flex;gap:12px;line-height:1.55}
  .idot{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:11px;color:var(--muted);flex:none}
  a{color:var(--soul);text-underline-offset:4px}
  b{color:var(--ink);font-weight:500}
  .hint{font-size:14px;color:rgba(154,160,196,.8);margin-top:16px}
  .btn{margin-top:32px;border:0;border-radius:999px;background:var(--soul);color:#241703;
    font:500 16px Inter,sans-serif;padding:12px 24px;cursor:pointer;transition:transform .15s}
  .btn:hover{transform:translateY(-2px)}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .btn-ghost{background:none;color:var(--muted);border:0;font:400 14px Inter;cursor:pointer;margin-left:16px}
  .vessel{margin-top:24px;border:1px dashed var(--line);background:var(--surface);border-radius:24px;
    padding:48px 24px;text-align:center;cursor:pointer;transition:all .2s}
  .vessel.hasfile{border-style:solid;border-color:rgba(232,176,96,.5)}
  .vessel:hover{border-color:rgba(232,176,96,.4)}
  .flamewrap{width:56px;height:56px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;margin:0 auto;transition:background .2s}
  .vessel.hasfile .flamewrap{background:rgba(232,176,96,.2)}
  fieldset{border:0;margin:32px 0 0;padding:0}
  legend{font-size:14px;color:var(--muted);padding:0}
  label.pii{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);background:var(--surface);
    border-radius:12px;padding:16px;margin-top:10px;cursor:pointer}
  label.pii.on{border-color:var(--soul);background:var(--surface2)}
  .radio{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted);margin-top:4px;flex:none}
  label.pii.on .radio{border-color:var(--soul);background:var(--soul)}
  .pii-l{color:var(--ink)} .pii-tag{color:var(--soul);font-size:12px;margin-left:8px}
  .pii-d{display:block;color:var(--muted);font-size:14px;margin-top:2px}
  .result-card{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:20px;margin-top:12px}
  .rc-tag{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .rc-prot{background:rgba(232,176,96,.15);color:var(--soul);border-radius:999px;padding:2px 8px;font-size:12px;margin-left:8px}
  .rc-body{font-size:15px;line-height:1.6;color:rgba(236,237,246,.9);margin:8px 0 0}
  .previewbadge{position:fixed;top:12px;right:12px;background:var(--surface2);border:1px solid var(--line);
    color:var(--muted);font-size:12px;padding:6px 12px;border-radius:999px}
  .hidden{display:none}
</style>
</head>
<body>
<div class="previewbadge">preview estático · dados de exemplo</div>
<main>
  <aside>
    <div class="rail-brand">
      <span id="brandflame"></span><span class="display">Second Soul</span>
    </div>
    <ol class="steps" id="rail"></ol>
  </aside>
  <section id="content"></section>
</main>

<script>
const FLAME = (lit=true)=>`<svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 2c0 4-5 5-5 10a5 5 0 0 0 10 0c0-2-1-3.5-2-5 0 2-1.5 3-3 3 1.5-3 0-6 0-8z" fill="${lit?'#E8B060':'#3A4067'}"/></svg>`;
document.getElementById('brandflame').innerHTML = FLAME(true);

const STEPS = [["01","Preparar o acervo"],["02","Enviar as conversas"],["03","Conferir a essência"]];
const PII = [
  ["strict","Rigoroso","Recomendado","Remove CPF, cartões, telefones, e-mails e senhas."],
  ["balanced","Equilibrado","","Remove CPF, cartões e senhas. Mantém contatos."],
  ["minimal","Mínimo","","Remove só senhas e cartões."],
];
const MOCK = {
  clean_count: 428, scrubbed_count: 3, by_role:{user:214, assistant:214},
  preview:[
    ["user","A consciência não se limita ao cérebro físico. Isso é central na conscienciologia.",false],
    ["assistant","Sim — a consciex seria a consciência atuando fora do soma.",false],
    ["user","Meu CPF é [CPF_REMOVIDO], guarda pra mim.",true],
  ]
};

let state = { step:1, file:null, pii:"strict", result:null };

function renderRail(){
  document.getElementById('rail').innerHTML = STEPS.map((s,i)=>{
    const active=state.step===i+1, done=state.step>i+1;
    return `<li><span class="snum ${active?'active':done?'done':''}">${s[0]}</span>
      <span class="stitle ${active?'active':''}">${s[1]}</span></li>`;
  }).join('');
}

function renderContent(){
  const c = document.getElementById('content');
  if(state.step===1){
    c.innerHTML = `
      <span class="eyebrow">Um acervo de conversas</span>
      <h1>Comece pelas conversas que ela já teve.</h1>
      <p class="lead">Anos de conversas com o ChatGPT guardam o jeito de pensar, os valores e a voz de uma pessoa. Traga esse acervo e a essência começa a tomar forma — sem começar do zero.</p>
      <div class="card">
        <h2>Como obter o arquivo</h2>
        <ol class="instr">
          <li><span class="idot">1</span><span>Na conta do ChatGPT, abra <a href="https://chatgpt.com/#settings/DataControls" target="_blank">Configurações › Controles de dados</a>.</span></li>
          <li><span class="idot">2</span><span>Em <b>Exportar dados</b>, toque em <b>Exportar</b> e confirme.</span></li>
          <li><span class="idot">3</span><span>Chega um e-mail com um link. Ele vale por 24 horas — baixe o <b>.zip</b> assim que chegar.</span></li>
        </ol>
        <p class="hint">Vai ajudar alguém idoso? Faça esses passos por ela, logado na conta dela. É o jeito mais simples.</p>
      </div>
      <button class="btn" onclick="go(2)">Já tenho o arquivo</button>`;
  }
  else if(state.step===2){
    c.innerHTML = `
      <span class="eyebrow">O acervo</span>
      <h1>Deixe as conversas entrarem.</h1>
      <div class="vessel ${state.file?'hasfile':''}" onclick="pick()" id="vessel">
        <div class="flamewrap">${FLAME(!!state.file)}</div>
        ${state.file
          ? `<p style="margin-top:16px"><b>${state.file}</b></p>`
          : `<p style="margin-top:16px">Arraste o arquivo aqui</p>
             <p style="margin-top:4px;font-size:14px;color:var(--muted)">ou toque para escolher — .zip ou conversations.json</p>`}
      </div>
      <fieldset>
        <legend>O que proteger antes de guardar</legend>
        ${PII.map(o=>`
          <label class="pii ${state.pii===o[0]?'on':''}" onclick="setPii('${o[0]}')">
            <span class="radio"></span>
            <span><span class="pii-l">${o[1]}${o[2]?`<span class="pii-tag">${o[2]}</span>`:''}</span>
            <span class="pii-d">${o[3]}</span></span>
          </label>`).join('')}
      </fieldset>
      <div>
        <button class="btn" ${state.file?'':'disabled'} onclick="read()">Ler as conversas</button>
        <button class="btn-ghost" onclick="go(1)">Voltar</button>
      </div>`;
  }
  else {
    const r = state.result || MOCK;
    c.innerHTML = `
      <span class="eyebrow">A essência</span>
      <h1>${r.clean_count.toLocaleString('pt-BR')} lembranças reunidas.</h1>
      <p class="lead">Lemos o acervo e guardamos ${r.clean_count.toLocaleString('pt-BR')} trechos de conversa — ${(r.by_role.user||0).toLocaleString('pt-BR')} deles são a própria voz da pessoa. ${r.scrubbed_count>0?`Protegemos ${r.scrubbed_count} com dados sensíveis antes de guardar.`:'Nenhum dado sensível precisou ser removido.'}</p>
      <div style="margin-top:32px">
        ${r.preview.map(p=>`
          <div class="result-card">
            <div><span class="rc-tag">${p[0]==='user'?'voz dela':p[0]==='assistant'?'resposta':p[0]}</span>${p[2]?'<span class="rc-prot">protegido</span>':''}</div>
            <p class="rc-body">${p[1]}</p>
          </div>`).join('')}
      </div>
      <div><button class="btn" onclick="alert('Próxima etapa: gerar o gêmeo a partir dessas lembranças.')">Continuar</button>
      <button class="btn-ghost" onclick="reset()">Enviar outro arquivo</button></div>`;
  }
}

function render(){ renderRail(); renderContent(); }
function go(s){ state.step=s; render(); }
function setPii(p){ state.pii=p; render(); }
function pick(){
  const i=document.createElement('input'); i.type='file'; i.accept='.zip,.json';
  i.onchange=e=>{ if(e.target.files[0]){ state.file=e.target.files[0].name; state._file=e.target.files[0]; render(); } };
  i.click();
}
function reset(){ state.file=null; state._file=null; state.result=null; go(2); }

const STAGES=[["detectando","Reconhecendo o arquivo"],["lendo","Lendo as conversas"],
 ["limpando","Removendo ruído"],["deduplicando","Removendo repetições"],
 ["protegendo","Protegendo dados sensíveis"],["concluido","Pronto"]];

function renderProgress(stageKey, raw){
  const i = Math.max(0, STAGES.findIndex(s=>s[0]===stageKey));
  const pct = Math.round(((i+1)/STAGES.length)*100);
  return `<div class="card" style="margin-top:24px" role="status" aria-live="polite">
    <div style="height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-bottom:16px">
      <div style="height:100%;width:${pct}%;background:var(--soul);border-radius:99px;transition:width .5s"></div></div>
    ${STAGES.map((s,n)=>{
      const done=n<i, now=n===i;
      return `<div style="display:flex;gap:12px;align-items:center;font-size:14px;margin-top:10px">
        <span style="width:16px;height:16px;border-radius:50%;flex:none;border:1px solid ${done||now?'var(--soul)':'var(--line)'};background:${done?'var(--soul)':'transparent'};display:grid;place-items:center">
        ${now?'<span style="width:6px;height:6px;border-radius:50%;background:var(--soul)"></span>':''}</span>
        <span style="color:${done||now?'var(--ink)':'var(--muted)'}">${s[1]}</span></div>`;
    }).join('')}
    <p class="hint">${raw?`${raw.toLocaleString('pt-BR')} mensagens encontradas — pode deixar a página aberta.`:'Isso pode levar alguns minutos em acervos grandes.'}</p>
  </div>`;
}

async function read(){
  const btn=document.querySelector('.btn'); btn.textContent='Lendo as conversas…'; btn.disabled=true;
  const host=document.createElement('div'); document.getElementById('content').appendChild(host);
  host.innerHTML=renderProgress('detectando');
  try{
    const form=new FormData(); form.append('file', state._file); form.append('pii_level', state.pii);
    const res=await fetch('http://localhost:8010/api/v1/import/upload',{method:'POST',body:form});
    if(!res.ok) throw new Error();
    const {job_id}=await res.json();
    for(;;){
      const s=await (await fetch(`http://localhost:8010/api/v1/import/status/${job_id}`)).json();
      host.innerHTML=renderProgress(s.stage, s.stage_info && s.stage_info.raw_count);
      if(s.status==='done'){ state.result=s.result; break; }
      if(s.status==='error'){ throw new Error(s.error); }
      await new Promise(r=>setTimeout(r,700));
    }
  }catch(e){
    // sem API de pé: mostra o progresso simulado e cai no exemplo
    for(const st of STAGES){ host.innerHTML=renderProgress(st[0], 5379); await new Promise(r=>setTimeout(r,400)); }
    state.result=MOCK;
  }
  go(3);
}

render();
</script>
</body>
</html>
