[project]
name = "second-soul-voices"
version = "0.1.0"
description = "Separação de vozes de contas compartilhadas — Second Soul"
requires-python = ">=3.11"
dependencies = ["scikit-learn>=1.4", "numpy>=1.26"]

[project.optional-dependencies]
sbert = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.2"]

[project.scripts]
ss-voices = "second_soul_voices.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["second_soul_voices*"]
